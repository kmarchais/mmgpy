[build-system]
requires = [
    "scikit-build-core>=1.0.0",
    "pybind11>=3.0.4",
    # Add numpy to build requirements for headers
    "numpy>=2.1.0",
    # patchelf is needed during install to set RPATH on Linux
    "patchelf>=0.17.2.4; sys_platform == 'linux'",
]
build-backend = "scikit_build_core.build"

[project]
name = "mmgpy"
version = "0.18.0.dev0"
description = "Python bindings for the MMG software"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1.0,<3",
    "patchelf>=0.17.2.4,<1; sys_platform == 'linux'",
    "rich>=13.0.0,<16",
    "scipy>=1.13.0,<2",
]
authors = [{ name = "Kevin Marchais", email = "kevinmarchais@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Optional dependencies for pip/uvx users (e.g., pip install mmgpy[ui])
# Note: dependency-groups below are for local dev with uv sync --group <name>
[project.optional-dependencies]
fem = [
    "fedoo>=0.8.3,<2",
]
pyvista = [
    "pyvista>=0.48,<1",
]
ui = [
    "mmgpy[pyvista]",
    "pywebview>=6.2.1,<7",
    "trame>=3.13.1,<5",
    "trame-vtk>=2.11.6,<3",
    "trame-vuetify>=3.2.1,<4",
]

[tool.mmgpy]
mmg_version = "5.8.0"

[tool.uv]
# Allow editable installs without --no-build-isolation flag
no-build-isolation-package = ["mmgpy"]

[tool.scikit-build]
minimum-version = "build-system.requires"

# Build configuration
build.verbose = true
cmake.version = ">=3.25"
cmake.define = { BUILD_TESTING = "OFF", BUILD_SHARED_LIBS = "ON", MMGPY_SKIP_EXECUTABLES = "OFF" }

build-dir = "build"

# Editable install configuration (auto-rebuild when C++ files change)
editable.rebuild = true
editable.verbose = false

# Wheel configuration
wheel.packages = ["src/mmgpy"]

# Source distribution
sdist.include = ["CMakeLists.txt", "src/*", "extern/*", "scripts/*"]
sdist.exclude = ["vtk*/**", "vtk*.tar.gz", "*.mesh", "*.sol", "*.vtk"]

# Scripts entry points - the unified 'mmg' command auto-detects mesh type
# and remeshes via the Python API (no subprocess, single file read).
[project.scripts]
mmgpy = "mmgpy._cli:_run_mmg"
mmg = "mmgpy._cli:_run_mmg"
mmg2d = "mmgpy._cli:_run_mmg2d"
mmg2d_O3 = "mmgpy._cli:_run_mmg2d"
mmg3d = "mmgpy._cli:_run_mmg3d"
mmg3d_O3 = "mmgpy._cli:_run_mmg3d"
mmgs = "mmgpy._cli:_run_mmgs"
mmgs_O3 = "mmgpy._cli:_run_mmgs"

[project.entry-points."mmgpy.ui"]
ui = "mmgpy.ui:run_ui"

# PyVista 0.48 plugin registries: Medit reader/writer + .mmg accessor.
# These activate on first use (lazy) so users who never touch MMG pay nothing.
[project.entry-points."pyvista.readers"]
mesh = "mmgpy._pv_plugin:read_mesh"
meshb = "mmgpy._pv_plugin:read_mesh"

[project.entry-points."pyvista.writers"]
mesh = "mmgpy._pv_plugin:write_mesh"
meshb = "mmgpy._pv_plugin:write_mesh"

[project.entry-points."pyvista.accessors"]
mmg = "mmgpy._pv_plugin"

[project.gui-scripts]
mmgpy-ui = "mmgpy.ui.__main__:main"

[dependency-groups]
dev = [
    # Build dependencies (needed for editable installs without build isolation)
    "scikit-build-core>=1.0.0",
    "pybind11>=3.0.4",
    "numpy>=2.1.0",
    # Dev tools
    "build>=1.4.0",
    "imageio>=2.37.3",
    "meshio>=5.3.5,<6",
    "ty>=0.0.39",
    "prek>=0.4.1",
    "pytest>=9.0.3",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
    "pytest-codeblock>=0.5.10,<0.6",
    "pytest-pyvista>=0.3.3",
    "pyvista>=0.48,<1",
]
docs = [
    # Zensical's Mike fork preserves existing versions, aliases and PR previews.
    "mike @ git+https://github.com/squidfunk/mike.git@2d4ad799442f4592db8ad53b179bfb33db8c69ac",
    "mkdocstrings-python>=2.0.0,<3",
    # Belt-and-braces: pymdown-extensions 10.21.2 fixed the html.escape(None)
    # crash that previously forced a `pygments<2.20` cap (see git history).
    "pymdown-extensions>=10.21.2",
    "zensical>=0.0.72,<0.1",
]
ui = [
    "pywebview>=6.2.1",
    "trame>=3.13.1",
    "trame-vtk>=2.11.6",
    "trame-vuetify>=3.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "bench_*.py"]
image_cache_dir = "tests/image_cache"
markers = [
    "benchmark: marks tests as benchmarks (deselect with '-m \"not benchmark\"')",
]
[tool.pytest-codeblock]
test_nameless_codeblocks = true

[tool.ruff]
preview = true

[tool.complexipy]
# The UI is currently out of scope.
paths = ["src/mmgpy"]
exclude = ["ui/**"]
failed = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "incorrect-blank-line-before-class",   # incompatible with D211 (no-blank-line-before-class)
    "multi-line-summary-second-line",   # incompatible with D212 (multi-line-summary-first-line)
    "missing-trailing-comma", # conflicts with formatter
    # Project-wide opt-out (header boilerplate not wanted).
    "missing-copyright-notice", # missing-copyright-notice
]

# Preview-rule enforcement is currently scoped to ``src/mmgpy/`` (the public
# API surface). Outside of it, these preview-only rules are noise:
#   - docstring coverage (DOC201/DOC402/DOC501/DOC502) is overkill for
#     tests, fixtures, examples, and CI scripts.
#   - PLC2701 / S404 / PLW1514 / FURB11x / FURB14x / FURB15x / RUF027 are
#     refactor suggestions ill-suited to throwaway / demo code.
# Add a new fire to this list when a future PR cleans it up inside src/mmgpy/.
# Globs cannot be reused in TOML, so the same list is repeated below for each
# non-src tree.
[tool.ruff.lint.extend-per-file-ignores]
"docs/**/*.py" = [
    "implicit-namespace-package",  # docs/ is not a package, conftest.py doesn't need __init__.py
    "docstring-missing-returns", "docstring-missing-yields", "docstring-missing-exception", "docstring-extraneous-exception",  # preview docstring rules
    "import-private-name", "suspicious-subprocess-import", "unspecified-encoding",            # preview imports / IO
    "reimplemented-operator", "for-loop-set-mutations", "math-constant",         # preview refactors
    "missing-f-string-syntax",                                # preview missing-f-string
]
"src/mmgpy/_remesh.py" = [
    "invalid-class-name",    # class names match C++ API (mmg2d, mmg3d, mmgs)
]
"src/mmgpy/_mesh.py" = [
    "too-many-public-methods", # Mesh exposes the full public API (auto-detected 2D/3D/surface)
]
"src/mmgpy/_pv_plugin.py" = [
    "too-many-public-methods", # PyVista accessor exposes the full public API surface
]
"tests/**/*.py" = [
    "assert",    # asserts allowed in tests
    "print",    # print statements allowed in tests for debugging
    "private-member-access",  # accessing private members allowed in tests
    "blind-except",  # broad exception catching allowed in tests
    "import-outside-top-level", # imports inside functions are intentional for fixtures
    "non-lowercase-variable-in-function",    # uppercase variable names for matrices (M, D, H) standard in math
    "magic-value-comparison", # magic values allowed in tests
    "too-many-public-methods", # test classes group many test methods
    "too-many-arguments", # many arguments allowed in test helper functions
    "too-many-locals", # many locals allowed in test setup
    "no-self-use", # test methods don't need to use self
    "compare-to-empty-string", # tests assert empty-string sentinels literally
    "subprocess-without-shell-equals-true",    # subprocess calls allowed in tests
    "start-process-with-partial-path",    # partial executable paths allowed in tests
    "typing-only-standard-library-import",   # pathlib import in runtime allowed for test fixtures
    "ANN",     # type annotations not required for tests
    "implicit-namespace-package",  # tests/ subdirectories are intentional, not packages
    "docstring-missing-returns", "docstring-missing-yields", "docstring-missing-exception", "docstring-extraneous-exception",  # preview docstring rules
    "import-private-name", "suspicious-subprocess-import", "unspecified-encoding",            # preview imports / IO
    "reimplemented-operator", "for-loop-set-mutations", "math-constant",         # preview refactors
    "missing-f-string-syntax",                                # preview missing-f-string
    "float-equality-comparison",                                # exact float assertions are intentional in tests
]
"tests/logging_test.py" = [
    "pytest-fixture-autouse", # restore global logging state after every test
]
"docs/conftest.py" = [
    "pytest-fixture-autouse", # every collected documentation example needs real input files
    "assert", # assertions validate documentation test inputs
]
".github/scripts/**/*.py" = [
    "implicit-namespace-package",  # CI scripts are not a package
    "print",    # print statements needed for CI output
    "magic-value-comparison", # magic values (like argument counts) are fine in scripts
    "complex-structure",    # complex wheel optimization function is acceptable
    "too-many-return-statements", # multiple early returns in CLI dispatchers are clearer than nested branches
    "too-many-branches", # many branches in wheel optimization is acceptable
    "too-many-statements", # many statements in wheel optimization is acceptable
    "import-outside-top-level", # lazy imports keep optional deps (e.g. ``packaging``) opt-in for fast paths
    "docstring-missing-returns", "docstring-missing-yields", "docstring-missing-exception", "docstring-extraneous-exception",  # preview docstring rules
    "import-private-name", "suspicious-subprocess-import", "unspecified-encoding",            # preview imports / IO
    "reimplemented-operator", "for-loop-set-mutations", "math-constant",         # preview refactors
    "missing-f-string-syntax",                                # preview missing-f-string
]
"src/mmgpy/lagrangian.py" = [
    "too-many-arguments", # elasticity solver and move_mesh take genuinely required parameters
]
"examples/**/*.py" = [
    "print",    # print statements essential for example output
    "too-many-arguments", # many arguments allowed for clarity in examples
    "too-many-locals", # many locals allowed for didactic examples
    "too-many-statements", # long functions allowed for comprehensive examples
    "manual-list-comprehension", # list comprehensions not required in examples (readability first)
    "builtin-open",  # open() is fine for simple examples
    "magic-value-comparison", # magic values allowed in examples
    "non-lowercase-variable-in-function",    # uppercase variable names for matrices in examples
    "implicit-namespace-package",  # examples/ subdirectories are not packages
    "docstring-missing-returns", "docstring-missing-yields", "docstring-missing-exception", "docstring-extraneous-exception",  # preview docstring rules
    "import-private-name", "suspicious-subprocess-import", "unspecified-encoding",            # preview imports / IO
    "repeated-append", "reimplemented-operator", "for-loop-set-mutations", "math-constant",  # preview refactors
    "missing-f-string-syntax",                                # preview missing-f-string
]
"scripts/**/*.py" = [
    "implicit-namespace-package",  # scripts are not a package
    "print",    # print statements allowed in scripts
    "shebang-not-executable",  # shebang is fine in scripts
    "magic-value-comparison", # magic values allowed in scripts
    "subprocess-without-shell-equals-true",    # subprocess calls are safe (calling our own executables)
    "docstring-missing-returns", "docstring-missing-yields", "docstring-missing-exception", "docstring-extraneous-exception",  # preview docstring rules
    "import-private-name", "suspicious-subprocess-import", "unspecified-encoding",            # preview imports / IO
    "reimplemented-operator", "for-loop-set-mutations", "math-constant",         # preview refactors
    "missing-f-string-syntax",                                # preview missing-f-string
]
"benchmarks/**/*.py" = [
    "assert",    # asserts allowed in benchmarks
    "magic-value-comparison", # magic values allowed in benchmarks
    "too-many-locals", # many locals allowed in benchmark setup
    "no-self-use", # benchmark methods don't need to use self
    "implicit-namespace-package",  # benchmarks directory is not a package
    "typing-only-third-party-import",   # third-party imports in runtime for type annotations
    "typing-only-standard-library-import",   # stdlib imports in runtime for type annotations
    "subprocess-without-shell-equals-true",    # subprocess calls are safe (calling our own executables)
    "start-process-with-partial-path",    # partial executable paths are intentional for benchmarks
    "import-outside-top-level", # imports in functions are fine for benchmarks
    "print",    # print statements used for timing reports
    "docstring-missing-returns", "docstring-missing-yields", "docstring-missing-exception", "docstring-extraneous-exception",  # preview docstring rules
    "import-private-name", "suspicious-subprocess-import", "unspecified-encoding",            # preview imports / IO
    "repeated-append", "reimplemented-operator", "for-loop-set-mutations", "math-constant",  # preview refactors
    "missing-f-string-syntax",                                # preview missing-f-string
]
"src/mmgpy/__init__.py" = [
    "module-import-not-at-top-of-file",   # imports after re-export of _find_mmg_executable
    "undocumented-param",   # self parameter doesn't need documenting for methods
    "too-many-statements", # wrapper functions that patch multiple mesh classes have many statements
    "non-empty-init-module", # try/except for optional _version module is a packaging pattern
]
"src/mmgpy/_logging.py" = [
    "import-outside-top-level", # imports inside functions for optional Rich dependency
]
"src/mmgpy/_progress.py" = [
    "import-outside-top-level", # imports inside functions for optional Rich dependency
    "too-many-positional-arguments", # _emit_event mirrors the progress callback signature (positional)
]
"src/mmgpy/_mmgpy.pyi" = [
    "docstring-in-stub",  # Docstrings intentionally included for IDE support (issue #111)
    "overload-with-docstring",    # Docstrings in @overload methods intentional for IDE support
]
"src/mmgpy/interactive/*.py" = [
    "import-outside-top-level", # imports inside functions to avoid circular imports
]
"src/mmgpy/ui/**/*.py" = [
    "too-many-statements-in-try-clause", # callbacks report failures for the complete UI operation
    # Trame/UI patterns
    "import-outside-top-level", # imports inside functions for lazy loading
    "unused-method-argument",  # unused kwargs in callbacks (trame pattern)
    "ANN",     # type annotations not required for UI callbacks
    "FBT",     # boolean positional args for debug flag
    "multiple-with-statements",  # nested withs for trame context managers
    "line-too-long",    # long lines in UI strings (tooltips, JS expressions)
    # Complexity (parser and validation logic)
    "complex-structure",    # complex functions in parsers and remeshing
    "too-many-return-statements", # many returns in recursive AST evaluator
    "too-many-branches", # many branches in parser and validation logic
    "too-many-locals", # many locals in upload handlers and remeshing flow
    "too-many-statements", # many statements in sol file parser
    "magic-value-comparison", # magic values (MMG solution types, VTK cell types)
    # Error handling
    "blind-except",  # broad exception catching for UI error handling
    "try-except-pass",    # try-except-pass for optional features
    "suppressible-exception",  # try-except-pass for optional feature detection
    # Exception messages
    "raise-vanilla-args",  # exception messages are user-facing
    "raise-within-try",  # simple raises in validation code
    "raw-string-in-exception",   # string literals in exceptions for clarity
    "f-string-in-exception",   # f-string in exceptions for user messages
    # Other
    "ambiguous-unicode-character-string",  # unicode multiplication sign intentional (×)
    "non-empty-init-module",  # ui/__init__.py exposes top-level entry-point helpers
    "unnecessary-cast-to-int",  # int(floor()) is explicit for significant figures
    "redefined-loop-name", # loop variable reassignment in parsers.py
    "collapsible-if",  # nested ifs clearer in samples.py triangulate check
    "print",    # print used for debug HTML output
]
"blender_mmgpy/**/*.py" = [
    # ``bpy.utils.register_class()`` validates that an Operator / Panel
    # class name matches its ``bl_rna.identifier`` (e.g. ``MMGPY_OT_remesh``,
    # ``MMGPY_PT_main_panel``); CapWords would fail registration. Property
    # groups and AddonPreferences use CapWords already, so this only
    # applies to operator and panel definitions.
    "invalid-class-name",
    # ``bpy.props.<Property>`` callables are referenced *only* in class
    # annotations (e.g. ``radius: FloatProperty(default=0.1)``). Blender's
    # add-on metaclass evaluates those annotations at ``register_class()``
    # time to materialise RNA property descriptors, so the names must be
    # reachable from the module's runtime globals. ``exempt-modules`` would
    # be the surgical fix, but it is a global setting and tweaking it
    # changes lint behaviour in ``src/mmgpy/`` too.
    "typing-only-third-party-import",
]

[tool.ty.src]
# Keep ty's full-project pre-commit hook focused on the package source,
# matching `uv run ty check src/mmgpy/`.
include = ["src/mmgpy"]
# Exclude modules that rely on runtime integrations or incomplete third-party stubs.
# Progress module uses union types that cause complex type inference issues
# Interactive module uses PyVista types that have incomplete stubs
# UI module uses trame which has no type stubs
exclude = ["src/mmgpy/_progress.py", "src/mmgpy/interactive/**", "src/mmgpy/ui/**"]

[tool.ty.rules]
# Ignore unresolved imports for C++ extension module that isn't available at type-check time
unresolved-import = "ignore"

[tool.cibuildwheel]
build-frontend = "build[uv]"
build = "cp311-* cp312-* cp313-* cp314-* cp314t-*"
# Skip 32-bit builds, musllinux (pyvista depends on vtk which has no musllinux wheels),
# and free-threaded builds on Windows/macOS (vtk has no free-threaded wheels there)
skip = "*-win32 *-manylinux_i686 *-musllinux* cp314t-win* cp314t-macosx*"
test-command = 'python {project}/tests/native_cli_smoke_test.py'
build-verbosity = 1

[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
repair-wheel-command = "auditwheel repair -w {dest_dir} --exclude libmmg2d.so.5 --exclude libmmg3d.so.5 --exclude libmmgs.so.5 {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
repair-wheel-command = "cp {wheel} {dest_dir}/"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# Force delvewheel to vendor the MSVC runtime into ``mmgpy.libs/`` with
# mangled names. Without ``--add-dll``, delvewheel treats MSVCP140 /
# VCRUNTIME140 as "system" DLLs and leaves the .pyd importing them by
# basename. That breaks inside hosts that preload an older MSVC runtime —
# notably Blender 4.2 LTS / 4.5 / 5.0, which ship MSVCP140 14.29 in
# ``blender.crt``; the Windows loader's basename cache then hands our
# wheel that older copy and we crash on the first stdlib call that
# requires 14.40+ symbols (issue #299). Mangled, vendored copies cannot
# collide and are guaranteed to match what the binaries were built
# against.
# ``--exclude`` the mmg DLLs because they already sit in ``mmgpy/`` next
# to the .pyd (the loader's ``LOAD_LIBRARY_SEARCH_DLL_LOAD_DIR`` finds
# them there at runtime). Without ``--exclude`` delvewheel tries to
# resolve them via the Windows DLL search path, doesn't find them, and
# aborts with ``FileNotFoundError: Unable to find library: mmg2d.dll``.
repair-wheel-command = "delvewheel repair --add-dll \"msvcp140.dll;msvcp140_1.dll;msvcp140_2.dll;msvcp140_atomic_wait.dll;msvcp140_codecvt_ids.dll;vcruntime140.dll;vcruntime140_1.dll;concrt140.dll\" --exclude \"mmg2d.dll;mmg3d.dll;mmgs.dll\" -w {dest_dir} {wheel}"

[tool.coverage.run]
source = ["src/mmgpy"]
branch = true
omit = [
    "*/_mmgpy*",
    "*/interactive/*",  # PyVista UI code requires display, hard to test in CI
    "*/ui/__init__.py", # UI entry points require trame server
    "*/ui/__main__.py", # Entry point for UI
    "*/ui/app.py",      # Trame UI app requires browser
    "*/ui/viewer.py",   # Trame viewer mixin requires browser
    "*/ui/remeshing.py", # Trame remeshing mixin requires browser
]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
