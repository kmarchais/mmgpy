name: Documentation and examples

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        suite: [docs, examples]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install offscreen rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev libgl1-mesa-dev
      - run: uv sync --locked --extra fem
      - name: Run documentation or example tests
        env:
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: "true"
          SUITE: ${{ matrix.suite }}
        run: uv run --locked pytest "tests/${SUITE}_test.py" --failed_image_dir=image-regressions -v
      - name: Upload image regression diagnostics
        if: failure() && matrix.suite == 'examples'
        uses: actions/upload-artifact@v7
        with:
          name: example-image-regressions
          path: image-regressions/
          if-no-files-found: ignore
