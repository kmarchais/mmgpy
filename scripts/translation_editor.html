<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MMGpy translation review</title>
    <style>
      :root {
        color-scheme: light dark;
        --editor-fg: var(--foreground, #e8edf5);
        --editor-muted: var(--muted-foreground, #9ba9bb);
        --editor-card: var(--card, #17202d);
        --editor-input: var(--background, #101722);
        --editor-border: var(--border, #303d50);
        --editor-accent: var(--primary, #8ebaff);
        --editor-warning: var(--warning, #e8b86b);
        --editor-danger: var(--destructive, #ff9999);
        --editor-success: var(--success, #83d7b4);
        --editor-on-accent: var(--primary-foreground, #101722);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      body {
        color: var(--editor-fg);
        font-family: var(--font-sans, system-ui, sans-serif);
        font-size: 14px;
        line-height: 1.5;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      select,
      input[type="search"] {
        min-height: 38px;
        border: 1px solid var(--editor-border);
        border-radius: 7px;
        background: var(--editor-input);
        padding: 7px 11px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: var(--editor-accent);
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      button.primary {
        background: var(--editor-accent);
        color: var(--editor-on-accent);
        border-color: var(--editor-accent);
        font-weight: 650;
      }
      :focus-visible {
        outline: 2px solid var(--editor-accent);
        outline-offset: 3px;
      }
      input,
      select,
      textarea {
        min-width: 0;
      }
      textarea {
        width: 100%;
        min-height: 128px;
        resize: vertical;
        border: 1px solid var(--editor-border);
        border-radius: 8px;
        background: var(--editor-input);
        padding: 14px;
        font-size: 17px;
        line-height: 1.7;
      }
      [hidden] {
        display: none !important;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        font-size: 23px;
        letter-spacing: -0.6px;
        font-weight: 650;
      }
      h2 {
        font-size: 16px;
        font-weight: 600;
      }
      small,
      .muted {
        color: var(--editor-muted);
      }
      .app {
        max-width: 1180px;
        margin: 0 auto;
        padding: 8px;
      }
      .toolbar,
      .actions,
      .line,
      .nav,
      .meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }
      .toolbar {
        justify-content: space-between;
        padding: 6px 0 18px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .mark {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        color: var(--editor-accent);
        background: var(--editor-card);
        border: 1px solid var(--editor-border);
        border-radius: 9px;
        font-weight: 750;
      }
      .eyebrow {
        color: var(--editor-muted);
        font-size: 11px;
        letter-spacing: 1.3px;
        text-transform: uppercase;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(220px, 31%) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .panel {
        border: 1px solid var(--editor-border);
        border-radius: var(--radius, 12px);
        background: var(--editor-card);
        min-width: 0;
      }
      .catalog-head {
        padding: 16px;
        border-bottom: 1px solid var(--editor-border);
        display: grid;
        gap: 12px;
      }
      .catalog-head select,
      .catalog-head input {
        width: 100%;
      }
      label.caption,
      .caption {
        display: block;
        font-size: 12px;
        color: var(--editor-muted);
        margin-bottom: 6px;
      }
      .progress-track {
        height: 4px;
        background: var(--editor-border);
        border-radius: 4px;
        overflow: hidden;
      }
      .progress-track span {
        display: block;
        height: 100%;
        width: 0;
        background: var(--editor-accent);
      }
      .counts {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        color: var(--editor-muted);
      }
      .list {
        max-height: 420px;
        overflow-y: auto;
        padding: 6px;
      }
      .entry {
        width: 100%;
        display: block;
        text-align: left;
        border: 1px solid transparent;
        background: transparent;
        margin: 2px 0;
        padding: 10px;
        min-height: 62px;
      }
      .entry[aria-current="true"] {
        background: var(--editor-input);
        border-color: var(--editor-accent);
      }
      .entry .english,
      .entry .translation {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .entry .english {
        font-size: 13px;
        font-weight: 550;
      }
      .entry .translation {
        color: var(--editor-muted);
        font-size: 12px;
        padding-top: 2px;
      }
      .entry .flag {
        float: right;
        margin-left: 6px;
        font-size: 11px;
        color: var(--editor-warning);
      }
      .entry .flag.reviewed {
        color: var(--editor-success);
      }
      .editor {
        padding: 20px;
      }
      .meta {
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .pill {
        display: inline-block;
        font-size: 11px;
        border: 1px solid var(--editor-border);
        border-radius: 5px;
        padding: 2px 7px;
        color: var(--editor-muted);
      }
      .source {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 17px;
        line-height: 1.65;
        padding: 12px 0 20px;
      }
      .source-wrap {
        border-bottom: 1px solid var(--editor-border);
        margin-bottom: 18px;
      }
      .line {
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .line label {
        font-weight: 600;
      }
      .text-actions button {
        border: 0;
        background: transparent;
        color: var(--editor-muted);
        font-size: 12px;
        padding: 3px 6px;
        min-height: 28px;
      }
      .message {
        padding: 10px 12px;
        background: var(--editor-input);
        border-left: 3px solid var(--editor-warning);
        border-radius: 4px;
        margin-top: 10px;
        font-size: 13px;
      }
      .message.error {
        border-color: var(--editor-danger);
        color: var(--editor-danger);
      }
      .message.neutral {
        border-color: var(--editor-border);
        color: var(--editor-muted);
      }
      .metrics {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--editor-muted);
        padding: 8px 0;
      }
      .placeholders {
        min-height: 24px;
        padding-top: 3px;
        font-size: 12px;
        color: var(--editor-muted);
        overflow-wrap: anywhere;
      }
      code {
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 12px;
        padding: 2px 4px;
        background: var(--editor-input);
        border-radius: 4px;
        color: var(--editor-accent);
      }
      .preview {
        border-top: 1px solid var(--editor-border);
        margin-top: 18px;
        padding-top: 16px;
      }
      .preview-head {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
      }
      .preview-head label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--editor-muted);
      }
      #panel-width {
        width: 100px;
      }
      .preview-surface {
        max-width: 100%;
        border: 1px solid var(--editor-border);
        border-radius: 7px;
        padding: 10px;
        background: var(--editor-input);
        margin-top: 10px;
        font-size: 13px;
      }
      .preview-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
      }
      .preview-label {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        flex: 1;
      }
      .preview-value {
        border: 1px solid var(--editor-border);
        border-radius: 4px;
        padding: 2px 7px;
        min-width: 72px;
        text-align: center;
        color: var(--editor-muted);
      }
      .preview-surface.tooltip .preview-label {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .preview-surface.button .preview-row {
        border: 1px solid var(--editor-border);
        border-radius: 4px;
        text-align: center;
      }
      .preview-surface.heading .preview-label {
        font-weight: 650;
      }
      .preview-note {
        margin-top: 8px;
        font-size: 11px;
        color: var(--editor-muted);
      }
      .nav {
        justify-content: space-between;
        border-top: 1px solid var(--editor-border);
        margin-top: 18px;
        padding-top: 16px;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        margin: 14px 0 4px;
        font-size: 12px;
        color: var(--editor-muted);
      }
      .compare {
        margin-top: 12px;
      }
      .compare select {
        max-width: 220px;
      }
      #comparison-text {
        margin-top: 8px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--editor-muted);
      }
      #notice {
        margin: 0 0 14px;
      }
      .empty {
        padding: 24px 16px;
        color: var(--editor-muted);
      }
      @media (max-width: 660px) {
        .workspace {
          grid-template-columns: 1fr;
        }
        .list {
          max-height: 185px;
        }
        .editor {
          padding: 16px;
        }
        .toolbar {
          align-items: start;
          gap: 14px;
        }
        .actions {
          gap: 6px;
        }
        h1 {
          font-size: 20px;
        }
      }
      @media (pointer: coarse) {
        button,
        select,
        input[type="search"] {
          min-height: 44px;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --editor-fg: var(--foreground, #182335);
          --editor-muted: var(--muted-foreground, #5e6c7e);
          --editor-card: var(--card, #f8fafc);
          --editor-input: var(--background, #ffffff);
          --editor-border: var(--border, #d6deea);
          --editor-accent: var(--primary, #245caa);
          --editor-warning: var(--warning, #9d6419);
          --editor-danger: var(--destructive, #b1283b);
          --editor-success: var(--success, #197957);
          --editor-on-accent: var(--primary-foreground, #ffffff);
        }
      }
    </style>
  </head>
  <body>
    <main class="app" id="translation-app">
      <header class="toolbar">
        <div class="brand">
          <div class="mark" aria-hidden="true">M</div>
          <div>
            <div class="eyebrow">MMGpy</div>
            <h1>Translation review</h1>
          </div>
        </div>
        <div class="actions">
          <button id="open-csv">Open CSV</button
          ><button
            id="export-review"
            title="Back up translations and reviewed markers"
          >
            Export review</button
          ><button id="save-csv" class="primary">Save CSV</button>
        </div>
      </header>
      <div id="notice" class="message neutral" role="status" hidden></div>
      <div class="workspace">
        <aside class="panel" aria-label="Translation catalog">
          <div class="catalog-head">
            <div>
              <label class="caption" for="language">Review language</label
              ><select id="language"></select>
            </div>
            <div class="counts">
              <span id="review-count"></span><span id="issue-count"></span>
            </div>
            <div
              class="progress-track"
              role="progressbar"
              aria-label="Reviewed translations"
              aria-valuemin="0"
              aria-valuemax="151"
              aria-valuenow="0"
            >
              <span id="progress"></span>
            </div>
            <input
              id="search"
              type="search"
              placeholder="Search English or translation"
              aria-label="Search English or translation"
            />
            <select id="filter" aria-label="Filter translations">
              <option value="all">All messages</option>
              <option value="pending">Needs review</option>
              <option value="reviewed">Reviewed</option>
              <option value="edited">Edited</option>
              <option value="length">Length warnings</option>
              <option value="invalid">Invalid translations</option>
            </select>
          </div>
          <div id="message-list" class="list" aria-label="Messages"></div>
          <div id="list-count" class="counts" style="padding: 10px 16px"></div>
        </aside>
        <section class="panel editor" aria-label="Edit selected translation">
          <div id="entry-editor">
            <div class="meta">
              <span id="kind" class="pill"></span
              ><span id="entry-position" class="muted"></span>
            </div>
            <div class="source-wrap">
              <span class="caption">English reference</span>
              <p id="english" class="source" lang="en"></p>
            </div>
            <div class="line">
              <label id="translation-label" for="translation"></label
              ><span class="text-actions"
                ><button id="use-english">Use English</button
                ><button id="reset-entry">Reset entry</button></span
              >
            </div>
            <textarea
              id="translation"
              spellcheck="true"
              aria-describedby="placeholders validation length-warning"
            ></textarea>
            <div class="metrics">
              <span id="character-count"></span><span id="width-count"></span>
            </div>
            <div id="placeholders" class="placeholders"></div>
            <div
              id="validation"
              class="message error"
              role="alert"
              hidden
            ></div>
            <div id="length-warning" class="message" hidden></div>
            <details class="compare">
              <summary>Compare another language</summary>
              <label class="caption" for="compare-language"
                >Reference language</label
              ><select id="compare-language"></select>
              <p id="comparison-text"></p>
            </details>
            <div class="preview">
              <div class="preview-head">
                <h2>Sidebar preview</h2>
                <label for="panel-width"
                  >Width
                  <input
                    id="panel-width"
                    type="range"
                    min="180"
                    max="420"
                    value="280"
                  /><output id="width-label" for="panel-width"
                    >280 px</output
                  ></label
                >
              </div>
              <div id="preview-surface" class="preview-surface">
                <div class="preview-row">
                  <span id="preview-label" class="preview-label"></span
                  ><span id="preview-value" class="preview-value">0.100</span>
                </div>
              </div>
              <p class="preview-note">
                Approximate layout. Blender's font, UI scale, and available
                space can differ. Check flagged text in Blender.
              </p>
            </div>
            <div class="nav">
              <button id="previous" aria-label="Previous message">
                Previous</button
              ><label><input id="reviewed" type="checkbox" /> Reviewed</label
              ><button id="review-next" class="primary">
                Review &amp; next
              </button>
            </div>
          </div>
          <p id="empty-editor" class="empty" hidden>
            No messages match this filter.
          </p>
        </section>
      </div>
      <footer class="footer">
        <span id="draft-state" role="status" aria-live="polite"></span
        ><span
          >Ctrl / ⌘ + Enter to review &amp; continue
          <button id="import-review">Import review</button></span
        >
      </footer>
      <input id="csv-input" type="file" accept=".csv,text/csv" hidden />
      <input
        id="review-input"
        type="file"
        accept=".json,application/json"
        hidden
      />
    </main>
    <script id="catalog-data" type="application/json">
      __CATALOG_DATA__
    </script>
    <script>
      "use strict";
      const DATA = JSON.parse(
        document.getElementById("catalog-data").textContent,
      );
      const $ = (id) => document.getElementById(id);
      const LANGUAGE_NAMES = {
        fr_FR: "French · Français",
        ru_RU: "Russian · Русский",
        es: "Spanish · Español",
        de_DE: "German · Deutsch",
        it_IT: "Italian · Italiano",
        ar_EG: "Arabic · العربية",
        zh_HANS: "Chinese · 简体中文",
        zh_HANT: "Chinese · 繁體中文",
        ja_JP: "Japanese · 日本語",
        ko_KR: "Korean · 한국어",
        pt_BR: "Portuguese · Brasil",
        pt_PT: "Portuguese · Portugal",
        pl_PL: "Polish · Polski",
        uk_UA: "Ukrainian · Українська",
        tr_TR: "Turkish · Türkçe",
      };
      const LOCALES = DATA.columns.filter((key) => key !== "en_US");
      const original = structuredClone(DATA.rows);
      let rows = structuredClone(DATA.rows),
        baseline = structuredClone(DATA.rows),
        reviewed = {},
        language = LOCALES[0],
        selected = 0,
        visible = [];
      let fileHandle = null,
        diskText = null,
        storageAvailable = true;
      const storageKey = "mmgpy-review:" + DATA.source + ":" + DATA.revision;
      let savedCsv = toCsv(rows);
      const canvas = document.createElement("canvas");
      const measure = canvas.getContext("2d");
      measure.font = "13px system-ui, sans-serif";
      const segmenter =
        typeof Intl.Segmenter === "function"
          ? new Intl.Segmenter(undefined, { granularity: "grapheme" })
          : null;
      const charCount = (text) =>
        segmenter
          ? Array.from(segmenter.segment(text)).length
          : Array.from(text).length;
      const languageTag = (locale) =>
        ({ zh_HANS: "zh-Hans", zh_HANT: "zh-Hant", es: "es" })[locale] ||
        locale.replace("_", "-");
      const kindOf = (row) => DATA.kinds[row.en_US] || "Label";
      const isReviewed = (row) =>
        reviewed[language]?.[row.en_US] === row[language];
      const isEdited = (row, index) =>
        row[language] !== baseline[index][language];

      function notice(text, error = false) {
        $("notice").textContent = text;
        $("notice").hidden = !text;
        $("notice").className = "message " + (error ? "error" : "neutral");
      }
      function fields(text) {
        const result = [];
        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          if ((ch === "{" || ch === "}") && text[i + 1] === ch) {
            i++;
            continue;
          }
          if (ch === "}") throw new Error("Unmatched closing brace.");
          if (ch !== "{") continue;
          const end = text.indexOf("}", i + 1);
          if (end < 0) throw new Error("Unmatched opening brace.");
          const body = text.slice(i + 1, end);
          if (!/^[A-Za-z_]\w*(?:![rsa])?(?::[^{}]*)?$/.test(body))
            throw new Error("Invalid placeholder: {" + body + "}.");
          result.push("{" + body + "}");
          i = end;
        }
        return result.sort();
      }
      function invalid(row, locale = language) {
        const text = row[locale];
        if (!text.trim())
          return "Enter a translation. Empty cells fall back to English in Blender.";
        if (text !== text.trim())
          return "Remove spaces at the beginning or end.";
        try {
          if (
            JSON.stringify(fields(text)) !== JSON.stringify(fields(row.en_US))
          )
            return "Keep every English placeholder exactly, including its format. You can change their order.";
        } catch (error) {
          return error.message;
        }
        return "";
      }
      function sample(text) {
        return text.replace(
          /\{([A-Za-z_]\w*)(?:![rsa])?(?::([^{}]*))?\}/g,
          (_, name, spec) =>
            /error/.test(name)
              ? "Example error"
              : /name/.test(name)
                ? "Sphere"
                : /version/.test(name)
                  ? "0.17.1"
                  : spec?.includes("f")
                    ? "0.250"
                    : "1,234",
        );
      }
      function lengthInfo(row) {
        const english = row.en_US,
          text = row[language],
          kind = kindOf(row);
        const a = charCount(english),
          b = charCount(text);
        const sourceWidth = measure.measureText(sample(english)).width;
        const targetWidth = measure.measureText(sample(text)).width;
        const isLongText = kind === "Tooltip" || kind === "Message";
        const expanded =
          b >
          Math.max(a * (isLongText ? 1.8 : 1.45), a + (isLongText ? 30 : 8));
        const available =
          Number($("panel-width").value) - 22 - (kind === "Control" ? 80 : 0);
        const clipped = !isLongText && targetWidth > available;
        return {
          a,
          b,
          sourceWidth,
          targetWidth,
          expanded,
          clipped,
          warning: expanded || clipped,
        };
      }
      function toCsv(catalog) {
        const quote = (text) =>
          /[",\r\n]/.test(text) ? '"' + text.replaceAll('"', '""') + '"' : text;
        return (
          [
            DATA.columns,
            ...catalog.map((row) => DATA.columns.map((key) => row[key])),
          ]
            .map((row) => row.map(quote).join(","))
            .join("\n") + "\n"
        );
      }
      function parseCsv(text) {
        const result = [];
        let row = [],
          cell = "",
          quoted = false,
          closed = false;
        text = text.replace(/^\uFEFF/, "");
        const finishCell = () => {
          row.push(cell);
          cell = "";
          closed = false;
        };
        const finishRow = () => {
          finishCell();
          if (row.length > 1 || row[0] !== "") result.push(row);
          row = [];
        };
        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          if (quoted) {
            if (ch === '"' && text[i + 1] === '"') {
              cell += '"';
              i++;
            } else if (ch === '"') {
              quoted = false;
              closed = true;
            } else cell += ch;
          } else if (ch === ",") finishCell();
          else if (ch === "\n" || ch === "\r") {
            if (ch === "\r" && text[i + 1] === "\n") i++;
            finishRow();
          } else if (ch === '"' && !cell && !closed) quoted = true;
          else if (ch === '"' || closed)
            throw new Error("Invalid CSV quoting.");
          else cell += ch;
        }
        if (quoted) throw new Error("Unclosed quoted CSV field.");
        if (cell || row.length || closed) finishRow();
        const columns = result.shift();
        if (
          !columns ||
          columns.length !== DATA.columns.length ||
          new Set(columns).size !== columns.length ||
          DATA.columns.some((key) => !columns.includes(key))
        )
          throw new Error(
            "This CSV has different language columns. Generate a new editor for it.",
          );
        const catalog = result.map((cells) => {
          if (cells.length !== columns.length)
            throw new Error("A CSV row has missing or extra cells.");
          return Object.fromEntries(
            columns.map((key, index) => [key, cells[index]]),
          );
        });
        return validateCatalog(catalog);
      }
      function validateCatalog(catalog) {
        if (!Array.isArray(catalog) || catalog.length !== original.length)
          throw new Error(
            "This catalog has different English messages. Generate a new editor for it.",
          );
        const byEnglish = new Map();
        for (const row of catalog) {
          if (
            !row ||
            DATA.columns.some((key) => typeof row[key] !== "string") ||
            byEnglish.has(row.en_US)
          )
            throw new Error(
              "Catalog rows must be unique and contain every language.",
            );
          byEnglish.set(row.en_US, row);
        }
        return original.map((row) => {
          if (!byEnglish.has(row.en_US))
            throw new Error("The English messages do not match this editor.");
          return Object.fromEntries(
            DATA.columns.map((key) => [key, byEnglish.get(row.en_US)[key]]),
          );
        });
      }
      function snapshot() {
        return {
          version: 1,
          revision: DATA.revision,
          rows,
          baseline,
          reviewed,
          language,
          selected,
          savedCsv,
        };
      }
      function restore(state) {
        if (!state || state.version !== 1)
          throw new Error("Unsupported review backup.");
        const catalog = validateCatalog(state.rows);
        const markers = {};
        for (const locale of LOCALES) {
          markers[locale] = {};
          for (const row of catalog) {
            if (state.reviewed?.[locale]?.[row.en_US] === row[locale])
              markers[locale][row.en_US] = row[locale];
          }
        }
        const restoredBaseline = state.baseline
          ? validateCatalog(state.baseline)
          : structuredClone(original);
        rows = catalog;
        baseline = restoredBaseline;
        reviewed = markers;
        language = LOCALES.includes(state.language)
          ? state.language
          : LOCALES[0];
        selected =
          Number.isInteger(state.selected) &&
          state.selected >= 0 &&
          state.selected < rows.length
            ? state.selected
            : 0;
        savedCsv =
          typeof state.savedCsv === "string" ? state.savedCsv : toCsv(original);
      }
      function persist() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(snapshot()));
          storageAvailable = true;
        } catch {
          storageAvailable = false;
        }
        $("draft-state").textContent = storageAvailable
          ? toCsv(rows) === savedCsv
            ? "Draft saved in this browser · CSV unchanged"
            : "Draft saved in this browser · CSV edits to export"
          : "Draft storage unavailable · Export review to keep your work";
      }
      function refreshList() {
        const query = $("search").value.toLocaleLowerCase(),
          filter = $("filter").value;
        let complete = 0,
          warnings = 0;
        visible = [];
        rows.forEach((row, index) => {
          const done = isReviewed(row),
            error = invalid(row),
            long = lengthInfo(row).warning;
          complete += Number(done);
          warnings += Number(long);
          const matches = {
            all: true,
            pending: !done,
            reviewed: done,
            edited: isEdited(row, index),
            length: long,
            invalid: !!error,
          }[filter];
          if (
            matches &&
            (!query ||
              row.en_US.toLocaleLowerCase().includes(query) ||
              row[language].toLocaleLowerCase().includes(query))
          )
            visible.push(index);
        });
        $("review-count").textContent =
          complete + " / " + rows.length + " reviewed";
        $("issue-count").textContent = warnings + " length warnings";
        $("progress").style.width = (complete / rows.length) * 100 + "%";
        const progress = $("progress").parentElement;
        progress.setAttribute("aria-valuemax", String(rows.length));
        progress.setAttribute("aria-valuenow", String(complete));
        $("list-count").textContent = visible.length + " messages shown";
        const list = $("message-list");
        list.replaceChildren();
        for (const index of visible) {
          const row = rows[index],
            button = document.createElement("button");
          button.className = "entry";
          button.dataset.index = index;
          button.setAttribute("aria-current", String(index === selected));
          const flag = document.createElement("span");
          flag.className = "flag";
          if (invalid(row)) flag.textContent = "Invalid";
          else if (isReviewed(row)) {
            flag.textContent = "Reviewed";
            flag.classList.add("reviewed");
          } else if (lengthInfo(row).warning) flag.textContent = "Length";
          const english = document.createElement("span");
          english.className = "english";
          english.textContent = row.en_US;
          const translated = document.createElement("span");
          translated.className = "translation";
          translated.textContent = row[language];
          translated.lang = languageTag(language);
          translated.dir = "auto";
          button.append(flag, english, translated);
          button.addEventListener("click", () => {
            selected = index;
            render();
            persist();
          });
          list.append(button);
        }
        if (!visible.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No matching messages.";
          list.append(empty);
        }
      }
      function showDetails(updateInput = true) {
        const row = rows[selected],
          exists = !!row;
        $("entry-editor").hidden = !exists;
        $("empty-editor").hidden = exists;
        if (!exists) return;
        const info = lengthInfo(row),
          error = invalid(row),
          kind = kindOf(row);
        $("kind").textContent = kind;
        $("entry-position").textContent = selected + 1 + " of " + rows.length;
        $("english").textContent = row.en_US;
        $("translation-label").textContent =
          LANGUAGE_NAMES[language].split(" · ")[0];
        if (updateInput) $("translation").value = row[language];
        $("translation").lang = languageTag(language);
        $("translation").dir = language === "ar_EG" ? "rtl" : "auto";
        $("reviewed").checked = isReviewed(row);
        $("reviewed").disabled = !!error;
        $("review-next").disabled = !!error;
        $("character-count").textContent =
          info.b +
          " characters · English " +
          info.a +
          " · " +
          (info.a ? Math.round((info.b / info.a) * 100) : 0) +
          "%";
        $("width-count").textContent =
          "Approx. text width " +
          Math.round(info.targetWidth) +
          " px · English " +
          Math.round(info.sourceWidth) +
          " px";
        $("validation").textContent = error;
        $("validation").hidden = !error;
        const warnings = [];
        if (info.expanded)
          warnings.push(
            "Substantially longer than English. Check the wording and available space.",
          );
        if (info.clipped)
          warnings.push(
            "May clip at this panel width. Check the sidebar preview and Blender.",
          );
        $("length-warning").textContent = warnings.join(" ");
        $("length-warning").hidden = !warnings.length;
        const placeholders = $("placeholders");
        placeholders.replaceChildren();
        const tokens = fields(row.en_US);
        placeholders.append(
          document.createTextNode(
            tokens.length ? "Keep exactly: " : "No formatting placeholders.",
          ),
        );
        for (const token of tokens) {
          const code = document.createElement("code");
          code.textContent = token;
          placeholders.append(code, document.createTextNode(" "));
        }
        const compare = $("compare-language").value;
        $("comparison-text").textContent = row[compare] || row.en_US;
        $("comparison-text").lang = languageTag(compare);
        $("comparison-text").dir = "auto";
        $("preview-surface").style.width = $("panel-width").value + "px";
        $("preview-surface").className =
          "preview-surface " +
          ({
            Control: "control",
            Button: "button",
            Heading: "heading",
            Tooltip: "tooltip",
            Message: "tooltip",
          }[kind] || "label");
        $("preview-label").textContent = sample(row[language]);
        $("preview-label").lang = languageTag(language);
        $("preview-label").dir = "auto";
        $("preview-value").hidden = kind !== "Control";
        $("width-label").textContent = $("panel-width").value + " px";
        $("previous").disabled = selected === visible[0];
      }
      function render() {
        $("language").value = language;
        refreshList();
        if (!visible.includes(selected)) selected = visible[0] ?? -1;
        refreshSelection();
        showDetails();
      }
      function refreshSelection() {
        for (const entry of $("message-list").querySelectorAll("button"))
          entry.setAttribute(
            "aria-current",
            String(Number(entry.dataset.index) === selected),
          );
      }
      function edit(value) {
        notice("");
        rows[selected][language] = value;
        refreshList();
        showDetails(false);
        persist();
      }
      function reviewNext() {
        if (!rows[selected] || invalid(rows[selected])) return;
        const current = selected,
          next = visible[visible.indexOf(current) + 1];
        (reviewed[language] ||= {})[rows[current].en_US] =
          rows[current][language];
        refreshList();
        selected =
          next !== undefined && visible.includes(next)
            ? next
            : (visible.find((index) => !isReviewed(rows[index])) ?? current);
        render();
        persist();
        $("translation").focus();
      }
      function download(text, filename, type) {
        const url = URL.createObjectURL(new Blob([text], { type }));
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
      }
      async function saveCsv() {
        for (const locale of LOCALES) {
          const bad = rows.findIndex((row) => invalid(row, locale));
          if (bad >= 0) {
            language = locale;
            selected = bad;
            $("filter").value = "invalid";
            $("search").value = "";
            render();
            notice(
              "Fix invalid translations before saving CSV. Export review can back up unfinished work.",
              true,
            );
            return;
          }
        }
        const text = toCsv(rows);
        try {
          if (!fileHandle && window.showSaveFilePicker) {
            try {
              const candidate = await window.showSaveFilePicker({
                suggestedName: "translations.csv",
                types: [
                  {
                    description: "Translation catalog",
                    accept: { "text/csv": [".csv"] },
                  },
                ],
              });
              const existing = await (await candidate.getFile()).text();
              if (existing && toCsv(parseCsv(existing)) !== toCsv(baseline))
                throw new Error(
                  "The selected file differs from the catalog you started with. Open it first to review its changes, or choose a new file.",
                );
              fileHandle = candidate;
              diskText = existing;
            } catch (error) {
              if (error.name === "AbortError") return;
              if (
                error.name !== "SecurityError" &&
                error.name !== "NotAllowedError"
              )
                throw error;
            }
          }
          if (fileHandle) {
            if (
              diskText !== null &&
              (await (await fileHandle.getFile()).text()) !== diskText
            )
              throw new Error(
                "The CSV changed on disk. Open it again to review those changes before saving.",
              );
            const writable = await fileHandle.createWritable();
            try {
              await writable.write(text);
              await writable.close();
            } catch (error) {
              await writable.abort().catch(() => {});
              throw error;
            }
            diskText = text;
            notice(
              "CSV saved. Review markers remain in your browser and exported review backups.",
            );
          } else {
            download(text, "translations.csv", "text/csv;charset=utf-8");
            notice(
              "CSV downloaded. Replace the project catalog with this file when ready.",
            );
          }
          savedCsv = text;
          persist();
        } catch (error) {
          notice(error.message, true);
        }
      }
      function acceptCsv(text, handle = null) {
        rows = parseCsv(text);
        baseline = structuredClone(rows);
        reviewed = {};
        selected = 0;
        savedCsv = toCsv(rows);
        fileHandle = handle;
        diskText = handle ? text : null;
        $("search").value = "";
        $("filter").value = "all";
        render();
        persist();
        notice("CSV opened. Review markers have been reset for this catalog.");
      }
      function mayReplace() {
        const hasReview = Object.values(reviewed).some((markers) =>
          Object.values(markers).some((value) => typeof value === "string"),
        );
        return (
          (toCsv(rows) === savedCsv && !hasReview) ||
          confirm(
            "Replace your current review? Export CSV or a review backup first if you want to keep it.",
          )
        );
      }
      $("translation").addEventListener("input", (event) =>
        edit(event.target.value),
      );
      $("language").addEventListener("change", (event) => {
        notice("");
        language = event.target.value;
        render();
        persist();
      });
      $("search").addEventListener("input", render);
      $("filter").addEventListener("change", render);
      $("panel-width").addEventListener("input", () => {
        refreshList();
        showDetails(false);
      });
      $("compare-language").addEventListener("change", () =>
        showDetails(false),
      );
      $("use-english").addEventListener("click", () => {
        $("translation").value = rows[selected].en_US;
        edit($("translation").value);
      });
      $("reset-entry").addEventListener("click", () => {
        $("translation").value = baseline[selected][language];
        edit($("translation").value);
      });
      $("reviewed").addEventListener("change", (event) => {
        (reviewed[language] ||= {})[rows[selected].en_US] = event.target.checked
          ? rows[selected][language]
          : null;
        render();
        persist();
      });
      $("previous").addEventListener("click", () => {
        selected = visible[Math.max(0, visible.indexOf(selected) - 1)];
        render();
        persist();
      });
      $("review-next").addEventListener("click", reviewNext);
      $("save-csv").addEventListener("click", saveCsv);
      $("export-review").addEventListener("click", () =>
        download(
          JSON.stringify(snapshot(), null, 2),
          "mmgpy-translation-review.json",
          "application/json",
        ),
      );
      $("import-review").addEventListener("click", () => {
        if (mayReplace()) $("review-input").click();
      });
      $("review-input").addEventListener("change", async (event) => {
        try {
          const file = event.target.files[0];
          if (!file) return;
          restore(JSON.parse(await file.text()));
          fileHandle = null;
          diskText = null;
          render();
          persist();
          notice("Review backup restored. Save CSV to apply its translations.");
        } catch (error) {
          notice(error.message, true);
        } finally {
          event.target.value = "";
        }
      });
      $("open-csv").addEventListener("click", async () => {
        if (!mayReplace()) return;
        try {
          if (window.showOpenFilePicker) {
            try {
              const [handle] = await window.showOpenFilePicker({
                multiple: false,
                types: [
                  {
                    description: "Translation catalog",
                    accept: { "text/csv": [".csv"] },
                  },
                ],
              });
              acceptCsv(await (await handle.getFile()).text(), handle);
              return;
            } catch (error) {
              if (error.name === "AbortError") return;
              if (
                error.name !== "SecurityError" &&
                error.name !== "NotAllowedError"
              )
                throw error;
            }
          }
          $("csv-input").click();
        } catch (error) {
          notice(error.message, true);
        }
      });
      $("csv-input").addEventListener("change", async (event) => {
        try {
          const file = event.target.files[0];
          if (file) acceptCsv(await file.text());
        } catch (error) {
          notice(error.message, true);
        } finally {
          event.target.value = "";
        }
      });
      document.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
          event.preventDefault();
          reviewNext();
        }
      });
      window.addEventListener("beforeunload", (event) => {
        if (toCsv(rows) !== savedCsv) {
          event.preventDefault();
          event.returnValue = "";
        }
      });
      for (const locale of LOCALES) {
        for (const id of ["language", "compare-language"]) {
          const option = document.createElement("option");
          option.value = locale;
          option.textContent = LANGUAGE_NAMES[locale] || locale;
          $(id).append(option);
        }
      }
      $("compare-language").value = "fr_FR";
      try {
        const draft = localStorage.getItem(storageKey);
        if (draft) {
          restore(JSON.parse(draft));
          notice(
            "Your local review draft has been restored. Files on disk are unchanged until you save CSV.",
          );
        }
      } catch {
        notice(
          "The saved draft could not be restored. Import an exported review backup to recover it.",
          true,
        );
      }
      render();
      persist();
    </script>
  </body>
</html>
